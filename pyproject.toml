[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socia"
version = "0.1.0"
description = "Socia AI Project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.2",
]

[tool.vercel]
entrypoint = "backend.main:app"
